# Build + prerender the site, then (only when enabled) upload dist/ to cPanel over FTPS.
#
# Repository Settings → Secrets and variables → Actions:
#   Variables: VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY, DEPLOY_ENABLED ("true" to deploy),
#              FTP_SERVER_DIR (optional, default "./" — the FTP account's folder for public_html)
#   Secrets:   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#
# Until DEPLOY_ENABLED is "true", every run only builds and checks — nothing touches the server.

name: Build & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 21:00 UTC = 02:00 Pakistan time. Fresh snapshots + sitemap for products added during the day.
    - cron: "0 21 * * *"

# Never run two deploys at once; a newer run waits for the current one to finish.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    # Pinned (not ubuntu-latest), so a new Ubuntu release can't change the build unannounced.
    runs-on: ubuntu-24.04
    # Prerendering ~3,100 pages takes roughly 10–15 minutes; the limit leaves plenty of headroom.
    timeout-minutes: 60
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Check repository variables
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Set VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY under Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi

      - run: npm ci

      - run: npm run build

      - name: Install Chromium for prerendering
        run: npx playwright install --with-deps chromium

      - name: Prerender pages + sitemap
        run: npm run prerender

      # Clicks through the built site in a browser, served exactly like cPanel serves it (snapshots,
      # 200.html, 404 for missing files). Any crash or white screen fails here → nothing is deployed.
      - name: Smoke test (real browser, desktop + mobile)
        run: npm run smoke

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          include-hidden-files: true # .htaccess
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: build
    # Off until the owner switches it on (Variables → DEPLOY_ENABLED = true). Only from main.
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # After a code change every page file changes, so the first upload sends all ~3,100 of them.
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Upload to cPanel (FTPS)
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          # Never "dangerous-clean-slate". The action records what it uploaded in
          # .ftp-deploy-sync-state.json and only ever deletes files from that list, so cgi-bin,
          # .well-known, mail folders and other server files are left alone.
